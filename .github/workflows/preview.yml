name: Deploy design preview to GitHub Pages

# Publishes the static design preview in /preview to GitHub Pages, giving a
# shareable URL for review.
#
# NOTE: GitHub Pages serves STATIC files only — it cannot run PHP, WordPress or
# MySQL. So this hosts the *design preview* (including the interactive Favorites
# ballot UI), not a working WordPress site. For the real thing, run the local
# environment with `npm start`, or install the theme ZIP on a staging host.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

on:
  push:
    branches: [ main ]
    paths:
      - 'preview/**'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-flight one, but never cancel a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # Tries to switch Pages on via the API. This succeeds only when the token
      # running the workflow is allowed to create a Pages site; a GitHub App
      # token without the Pages permission cannot, and returns
      # "Resource not accessible by integration". Non-fatal so the next step can
      # explain the fix rather than leaving a cryptic API error in the log.
      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explain how to finish setup
        if: steps.configure.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::Enable it once, then re-run this workflow."
          {
            echo "### GitHub Pages needs enabling once"
            echo
            echo "This workflow is correct, but it cannot switch Pages on by itself —"
            echo "the token available to it is not permitted to create a Pages site."
            echo
            echo "**Fix (about ten seconds, repository admin):**"
            echo
            echo "1. Open **Settings → Pages**"
            echo "2. Under **Build and deployment → Source**, choose **GitHub Actions**"
            echo "3. Re-run this workflow (Actions → Deploy design preview → Re-run jobs)"
            echo
            echo "The preview then publishes to:"
            echo '`https://brison-creator.github.io/My-Saline-/`'
            echo
            echo "Reminder: Pages serves static files only. This is the design preview"
            echo "(the Favorites ballot UI works); it is not a running WordPress site."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload the preview directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./preview

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
